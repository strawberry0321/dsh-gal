# ============================================================================
# dsh-gal —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时会按 bundle 层栈依次叠加各插件的 patch，
# 本文件把立绘挂件这一行插入 profile 的配置树。
#
# 安装（在任意目录执行，需要 DSH 的 dsh 命令）：
#   dsh plugin --profile desktop add dsh-gal
# 本地开发 / 未发布时：
#   dsh plugin --profile desktop add link:C:\path\to\dsh-gal
#
# 安装后重启 DSH Desktop 生效（宿主路由与注入脚本在进程启动时装配）。
# ============================================================================

- insert:
    - id: dsh-gal
      name: dsh-gal
